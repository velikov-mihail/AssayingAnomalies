# Release workflow for the AssayingAnomalies repo.
#
# On a tag v<version>:
#   build           -- checks that the tag equals the package version, builds the
#                      sdist and the wheel, runs `twine check`, prints their
#                      SHA-256 and keeps them as a workflow artifact. Runs in any
#                      repository, so a fork can check the build.
#   publish-pypi    -- uploads to PyPI by Trusted Publishing (OIDC; no token is
#                      stored). Only in velikov-mihail/AssayingAnomalies.
#   github-release  -- creates the GitHub release for the tag with the same
#                      files attached. Only in velikov-mihail/AssayingAnomalies.
#
# Started by hand (Actions > Release > Run workflow) it builds and uploads to
# TestPyPI instead, never to PyPI: the rehearsal. Use a development version
# for it (for example 0.9.0.dev1), because a version number can be uploaded to
# TestPyPI only once.
#
# One-time setup, on pypi.org (and test.pypi.org for the rehearsal), under
# "Publishing" for the project assayinganomalies: a Trusted Publisher with
# owner velikov-mihail, repository AssayingAnomalies (for TestPyPI: the
# repository the rehearsal runs in), workflow release.yml, environment pypi
# (TestPyPI: testpypi).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must equal the package version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version (expected tag v$version)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME = package version $version"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Check the metadata and print the SHA-256
        run: |
          python -m twine check --strict dist/*
          sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the wheel into a fresh venv and run aa
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          venv/bin/aa --version
          venv/bin/aa --help > /dev/null
          # The data files the package reads at run time are in the wheel
          venv/bin/python -c "from importlib.resources import files; p = files('assayinganomalies'); need = [p / 'py.typed', p / 'ingest' / 'data' / 'compustat_variables.csv', p / 'reporting' / 'bib' / 'newSignalTestBib.bib']; missing = [str(f) for f in need if not f.is_file()]; assert not missing, missing"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && github.repository == 'velikov-mihail/AssayingAnomalies'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/assayinganomalies/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the files attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."

  publish-testpypi:
    name: Publish to TestPyPI (rehearsal, started by hand)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/assayinganomalies/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
